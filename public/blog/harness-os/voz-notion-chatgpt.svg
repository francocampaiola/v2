<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Manejar el backlog de Notion hablando con ChatGPT</title>
  <desc id="d">Franco le habla a ChatGPT en modo voz dentro de un Proyecto que tiene cargada la skill del backlog. ChatGPT usa la app de Notion para leer y crear tickets en la base del backlog. harness-os toma los tickets en Ready y abre Pull Requests, y avisa en Discord cuando hay un PR para revisar.</desc>
  <rect width="1200" height="460" rx="28" fill="#0e1012"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a8a84"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ff6fb5"/></marker>
  </defs>
  <text x="48" y="64" fill="#f7f7f5" font-size="26" font-weight="600">Del audio al ticket, y del ticket al PR</text>
  <text x="48" y="94" fill="#aeaea8" font-size="16">La voz es la interfaz; Notion, la fuente de verdad; harness-os, el que ejecuta.</text>

  <!-- vos -->
  <rect x="48" y="140" width="220" height="220" rx="20" fill="#16181a"/>
  <circle cx="158" cy="210" r="38" fill="#26292b"/>
  <rect x="148" y="190" width="20" height="32" rx="10" fill="#f7f7f5"/>
  <path d="M138 214 a20 20 0 0 0 40 0" fill="none" stroke="#f7f7f5" stroke-width="3"/>
  <line x1="158" y1="234" x2="158" y2="242" stroke="#f7f7f5" stroke-width="3"/>
  <text x="158" y="280" fill="#f7f7f5" font-size="17" font-weight="600" text-anchor="middle">Vos, en modo voz</text>
  <text x="158" y="306" fill="#aeaea8" font-size="14" text-anchor="middle">"Quiero que los usuarios</text>
  <text x="158" y="326" fill="#aeaea8" font-size="14" text-anchor="middle">puedan exportar a CSV"</text>

  <line x1="268" y1="250" x2="318" y2="250" stroke="#ff6fb5" stroke-width="2" marker-end="url(#p)"/>

  <!-- chatgpt -->
  <rect x="320" y="140" width="300" height="220" rx="20" fill="#16181a"/>
  <text x="344" y="176" fill="#8a8a84" font-size="13" font-weight="600" letter-spacing="1.5">PROYECTO DE CHATGPT</text>
  <rect x="344" y="192" width="252" height="52" rx="12" fill="#1c1f21"/>
  <text x="362" y="224" fill="#f7f7f5" font-size="15" font-weight="600">Skill del backlog</text>
  <rect x="344" y="252" width="252" height="40" rx="12" fill="#1c1f21"/>
  <text x="362" y="277" fill="#aeaea8" font-size="14">Ejemplos de conversaciones</text>
  <rect x="344" y="300" width="252" height="40" rx="12" fill="#1c1f21"/>
  <text x="362" y="325" fill="#aeaea8" font-size="14">Documento de producto</text>

  <line x1="620" y1="250" x2="670" y2="250" stroke="#8a8a84" stroke-width="2" marker-end="url(#a)"/>

  <!-- notion -->
  <rect x="672" y="140" width="230" height="220" rx="20" fill="#16181a"/>
  <text x="696" y="176" fill="#8a8a84" font-size="13" font-weight="600" letter-spacing="1.5">NOTION</text>
  <text x="696" y="210" fill="#f7f7f5" font-size="17" font-weight="600">Development Backlog</text>
  <g font-size="13">
    <rect x="696" y="226" width="80" height="26" rx="13" fill="#26292b"/><text x="736" y="244" fill="#aeaea8" text-anchor="middle">Inbox</text>
    <rect x="784" y="226" width="80" height="26" rx="13" fill="rgba(255,111,181,0.18)"/><text x="824" y="244" fill="#ff87c2" text-anchor="middle">Ready</text>
    <rect x="696" y="260" width="80" height="26" rx="13" fill="#26292b"/><text x="736" y="278" fill="#aeaea8" text-anchor="middle">Running</text>
    <rect x="784" y="260" width="80" height="26" rx="13" fill="#26292b"/><text x="824" y="278" fill="#aeaea8" text-anchor="middle">Review</text>
    <rect x="696" y="294" width="80" height="26" rx="13" fill="rgba(95,181,114,0.18)"/><text x="736" y="312" fill="#6cc47f" text-anchor="middle">Done</text>
    <rect x="784" y="294" width="80" height="26" rx="13" fill="rgba(217,154,58,0.18)"/><text x="824" y="312" fill="#e3aa55" text-anchor="middle">Blocked</text>
  </g>

  <line x1="902" y1="250" x2="952" y2="250" stroke="#8a8a84" stroke-width="2" marker-end="url(#a)"/>

  <!-- harness -->
  <rect x="954" y="140" width="198" height="220" rx="20" fill="#ff6fb5"/>
  <text x="978" y="182" fill="#0e1012" font-size="19" font-weight="700">harness-os</text>
  <text x="978" y="210" fill="#0e1012" font-size="14">en la VPS</text>
  <text x="978" y="262" fill="#0e1012" font-size="14">spec → código →</text>
  <text x="978" y="284" fill="#0e1012" font-size="14">checks → review</text>
  <text x="978" y="330" fill="#0e1012" font-size="15" font-weight="700">→ Pull Request</text>

  <path d="M1053 360 C1053 420 158 420 158 362" fill="none" stroke="#5865f2" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <rect x="470" y="400" width="260" height="34" rx="17" fill="#1c1f21"/>
  <text x="600" y="422" fill="#c9cdfb" font-size="14" font-weight="600" text-anchor="middle">Aviso en Discord: "PR para revisar"</text>
</svg>
